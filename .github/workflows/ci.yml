# Continuous integration: every push to main and every pull request.
# Mirrors the checklist in CONTRIBUTING.md; all jobs must pass to merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99" # keep in sync with rust-toolchain.toml

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generated protocol code is up to date (D22)
        run: |
          scripts/gen-protocol.sh
          if [ -n "$(git status --porcelain -- crates/pax_protocol/src/generated)" ]; then
            git status --short -- crates/pax_protocol/src/generated
            echo "::error::crates/pax_protocol/src/generated is out of date with schemas/. Run scripts/gen-protocol.sh and commit the result."
            exit 1
          fi
      - name: Every crate applies the workspace lints
        run: python3 scripts/check_lints.py
      - name: Crate boundaries (D10, D12, AGENTS.md section 2)
        run: |
          deps() { cargo tree -p "$1" -e normal --prefix none | tail -n +2; }
          # Clients must not be able to simulate, not even in their tests (D12): dev
          # edges count too.
          for crate in pax_protocol pax_godot; do
            if cargo tree -p "$crate" -e normal,dev --prefix none | tail -n +2 | grep -q '^pax_engine '; then
              echo "::error::$crate depends on pax_engine. Clients must not be able to simulate (D10, D12)."
              exit 1
            fi
          done
          # pax_server is the only crate that sees both engine and wire types. The list
          # of engine-side crates is derived, so a new member is checked automatically.
          members=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(*(p["name"] for p in json.load(sys.stdin)["packages"]))')
          for crate in $members; do
            [ "$crate" = pax_server ] && continue
            if [ "$crate" != pax_engine ] && ! deps "$crate" | grep -q '^pax_engine '; then
              continue
            fi
            if deps "$crate" | grep -qE '^(pax_protocol|flatbuffers) '; then
              echo "::error::$crate links wire types; only pax_server may see both engine and wire (AGENTS.md section 2)."
              exit 1
            fi
            echo "$crate: engine-side, no wire types"
          done
          # The shared content hash carries nobody's types.
          if [ -n "$(deps pax_content)" ]; then
            echo "::error::pax_content must have no dependencies."
            exit 1
          fi
          # The bridge links pax_protocol and D12's side-neutral crates, and no other
          # workspace crate: an allowlist, so the exception can't grow unnoticed.
          extra=$(cargo tree -p pax_godot -e normal --depth 1 --prefix none | tail -n +2 \
            | grep '^pax_' | grep -vE '^(pax_protocol|pax_map|pax_content) ' || true)
          if [ -n "$extra" ]; then
            echo "::error::pax_godot links $extra; D12 allows pax_protocol, pax_map and pax_content only."
            exit 1
          fi
          # The shared map reader is linked by both sides, so it carries neither side's types.
          if deps pax_map | grep -qE '^(pax_engine|pax_protocol|flatbuffers) '; then
            echo "::error::pax_map must not depend on the engine or the wire types."
            exit 1
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - name: Clippy the server's fuzzing surface (the nightly fuzz job isn't required)
        run: cargo clippy -p pax_server --features fuzzing --all-targets --release -- -D warnings
      - name: Rustdoc (no broken links)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests and determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Tests (debug)
        run: cargo test --all
      - name: Tests (release)
        run: cargo test --all --release
      - name: Determinism gate (DECISIONS.md D11)
        run: |
          for s in scenarios/mini_valley scenarios/two_states; do
            cargo run --release -p pax_cli -- verify "$s" --threads 1
            cargo run --release -p pax_cli -- verify "$s" --threads 4
          done
      - name: Session replay through pax_cli (M3-9, the server's determinism gate)
        run: |
          cargo build --release -p pax_cli
          PAX_CLI=target/release/pax_cli PAX_CLI_REQUIRED=1 cargo test --release -p pax_server --test session_replay

  bench:
    # D13 / MILESTONE_1 T1: fail a PR that makes the daily tick > 20% slower.
    # Base and head are built and timed on the same runner (see scripts/bench-compare.sh).
    name: Benchmark regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Build head
        run: |
          cargo build --release -p pax_cli
          cp target/release/pax_cli "$RUNNER_TEMP/pax_cli_head"
      - name: Build base
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          # Shared target dir: dependencies built for head are reused.
          cargo build --release -p pax_cli --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir target
          cp target/release/pax_cli "$RUNNER_TEMP/pax_cli_base"
      - name: Compare base vs head (mini_valley, 1 market)
        run: |
          scripts/bench-compare.sh \
            "$RUNNER_TEMP/pax_cli_base" "$RUNNER_TEMP/base/scenarios/mini_valley" \
            "$RUNNER_TEMP/pax_cli_head" scenarios/mini_valley
      - name: Compare base vs head (two_states, nations and inputs)
        # Exercises the paths mini_valley doesn't: taxes, transfers, input chains,
        # and month-end systems (35 days covers the first month end).
        env:
          SCALE: "2000"
          DAYS: "35"
        run: |
          scripts/bench-compare.sh \
            "$RUNNER_TEMP/pax_cli_base" "$RUNNER_TEMP/base/scenarios/two_states" \
            "$RUNNER_TEMP/pax_cli_head" scenarios/two_states

  determinism-cross-platform:
    # Fixed-point state must hash identically on every OS/CPU we ship to (D3).
    name: Determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p pax_cli -- verify scenarios/mini_valley
      - run: cargo run --release -p pax_cli -- verify scenarios/two_states
      - name: Session replay through pax_cli (M3-9)
        shell: bash
        run: |
          cargo build --release -p pax_cli
          cli=target/release/pax_cli
          if [ -f "$cli.exe" ]; then cli="$cli.exe"; fi
          PAX_CLI="$cli" PAX_CLI_REQUIRED=1 cargo test --release -p pax_server --test session_replay

  client-smoke:
    # M3-8: the real client, headless. It launches pax_server through the bridge,
    # plays a policy and a save/list/load round trip at full speed and quits; any script
    # error, protocol error or lost connection fails it (client/smoke.gd, --smoke).
    name: Client smoke test (headless Godot)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the bridge and the server
        run: cargo build -p pax_godot -p pax_server
      - name: Bridge tests against the real server binary (launcher included)
        run: PAX_SERVER=target/debug/pax_server cargo test -p pax_godot
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA256}  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
      - name: Import the project
        # The extension is listed before the first import, so Godot loads it at
        # startup. Registered mid-scan instead (a fresh project), unloading it at the
        # import's exit aborts (Godot 4.7.2 + godot-rust 0.5.5; client/README.md).
        run: |
          mkdir -p client/.godot
          echo "res://pax_godot.gdextension" > client/.godot/extension_list.cfg
          timeout 300 "$RUNNER_TEMP/godot" --headless --path client --import
      - name: Smoke test
        run: timeout 180 "$RUNNER_TEMP/godot" --headless --path client -- --smoke | tee smoke.log && grep -q "SMOKE OK" smoke.log
      - name: Smoke test, hosting a multiplayer game
        # M4-9: hosts a game over TLS the way a player would, through the lobby
        # (client/smoke_host.gd, --smoke-host).
        run: timeout 180 "$RUNNER_TEMP/godot" --headless --path client -- --smoke-host | tee smoke-host.log && grep -q "SMOKE OK (host)" smoke-host.log

  fuzz:
    # M3-10: coverage-guided fuzzing of the client frame reader, for a fixed budget.
    # Needs nightly, so it lives outside the workspace (fuzz/). Not a required check:
    # a crash uploads its input as an artifact, to reproduce and fix.
    name: Fuzz client frames (60 s)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to its own target,
      # which the address sanitizer can't build for: name the runner's target.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu client_frames -- -max_total_time=60
        working-directory: fuzz
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
