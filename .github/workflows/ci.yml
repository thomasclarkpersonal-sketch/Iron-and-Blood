# Continuous integration: every push to main and every pull request.
# Mirrors the checklist in CONTRIBUTING.md; all jobs must pass to merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99" # keep in sync with rust-toolchain.toml

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - name: Rustdoc (no broken links)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests and determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Tests (debug)
        run: cargo test --all
      - name: Tests (release)
        run: cargo test --all --release
      - name: Determinism gate (DECISIONS.md D11)
        run: |
          cargo run --release -p pax_cli -- verify scenarios/mini_valley --threads 1
          cargo run --release -p pax_cli -- verify scenarios/mini_valley --threads 4
      - name: Benchmark smoke run (1M POP rows)
        # Reports timing in the log; the regression gate is MILESTONE_1 task T1.
        run: cargo run --release -p pax_cli -- bench scenarios/mini_valley --days 5 --scale 170000 --threads 4

  determinism-cross-platform:
    # Fixed-point state must hash identically on every OS/CPU we ship to (D3).
    name: Determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p pax_cli -- verify scenarios/mini_valley
