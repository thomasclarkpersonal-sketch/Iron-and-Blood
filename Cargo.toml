[workspace]
resolver = "3"
# `fuzz/` is its own workspace (nightly only, M3-10).
exclude = ["fuzz"]
members = ["crates/pax_engine", "crates/pax_data", "crates/pax_cli", "crates/pax_server", "crates/pax_protocol", "crates/pax_godot", "crates/pax_content"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
pax_engine = { path = "crates/pax_engine" }
pax_data = { path = "crates/pax_data" }
pax_protocol = { path = "crates/pax_protocol" }
pax_content = { path = "crates/pax_content" }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# Pinned exactly, once for the whole workspace: generated protocol code only works
# with the runtime of the flatc version that produced it (scripts/gen-protocol.sh, D22).
flatbuffers = "=24.3.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Floats are banned from simulation state (DECISIONS.md D3); flag accidental use.
float_arithmetic = "warn"

[profile.release]
debug = 1
# Overflow in fixed-point math is a bug: keep integer overflow checks on in release too.
overflow-checks = true
