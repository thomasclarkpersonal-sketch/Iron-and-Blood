# Milestone 1 content scenario (task T2): two states with different endowments.
# Lowland is agrarian and textile-heavy; Highland has the mines and the steel.
# The markets do not trade until M2 (DECISIONS.md D14), so each state runs complete local chains.

name = "Two States"
seed = 1848
data = "../../data"
commands = "commands.toml"   # policy timeline (D21)
map = "map"                  # province map for the client (M3-7)

# Governments (DECISIONS.md D15, D16): a flat income tax withheld from wages and
# dividends, a daily per-capita transfer of a share of the treasury, and daily
# government consumption of a basket of goods (administration and public works).
[[nation]]
key = "lowland_kingdom"
treasury = 2000
income_tax_rate = 0.08
transfer_rate = 0.05
consumption_rate = 0.05
basket = { grain = 0.2, clothes = 0.2, furniture = 0.25, tools = 0.35 }

[[nation]]
key = "highland_republic"
treasury = 2000
income_tax_rate = 0.12
transfer_rate = 0.05
consumption_rate = 0.05
basket = { grain = 0.2, clothes = 0.15, furniture = 0.15, tools = 0.5 }

[[market]]
key = "lowland"
nation = "lowland_kingdom"

[[market]]
key = "highland"
nation = "highland_republic"

