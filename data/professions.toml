# Consumer behaviour per profession: Linear Expenditure System (DECISIONS.md D2).
#   subsistence = gamma: units per person per day needed to survive ("life needs")
#   preference  = beta:  relative share of discretionary budget per good
#                         (normalised to sum to 1 at load time)
#   spend_rate  = fraction of cash budgeted for consumption each day

